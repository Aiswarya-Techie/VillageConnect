<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VillageConnect - Officer Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="navbar">
    <div class="logo">🏡 VillageConnect</div>
    <div class="nav-links">
      <a href="performance.html" class="nav-link">📊 Performance Board</a>
      <a href="index.html" class="admin-btn">Home</a>
    </div>
  </nav>

  <div id="admin-login" class="auth-container">
    <div class="auth-card">
      <h2>👮 Officer Login</h2>
      <p class="auth-subtitle">Enter admin password to access dashboard</p>
      <div class="form-group">
        <label>Admin Password</label>
        <input type="password" id="admin-pass" placeholder="Enter password">
      </div>
      <button onclick="adminLogin()" class="submit-btn">Login</button>
      <p style="margin-top:10px; color:#666; font-size:0.9rem;">Demo password: <strong>admin123</strong></p>
    </div>
  </div>

  <div id="admin-dashboard" class="hidden">
    <div class="hero">
      <h1>Officer Dashboard</h1>
      <p>Manage complaints and update resolution status</p>
    </div>

    <div class="container" style="display:block; max-width:1100px;">
      <div class="stats-row">
        <div class="stat-card">
          <h3 id="total-count">0</h3><p>Total</p>
        </div>
        <div class="stat-card pending">
          <h3 id="pending-count">0</h3><p>Pending</p>
        </div>
        <div class="stat-card" style="border-top-color:#3498db">
          <h3 id="progress-count">0</h3><p>In Progress</p>
        </div>
        <div class="stat-card resolved">
          <h3 id="resolved-count">0</h3><p>Resolved</p>
        </div>
      </div>

      <div class="filter-row" style="margin-top:20px;">
        <select id="filter-status" onchange="filterComplaints()">
          <option value="all">All Status</option>
          <option value="Pending">Pending</option>
          <option value="In Progress">In Progress</option>
          <option value="Resolved">Resolved</option>
        </select>
        <select id="filter-category" onchange="filterComplaints()">
          <option value="all">All Categories</option>
          <option value="Water">Water</option>
          <option value="Roads">Roads</option>
          <option value="Healthcare">Healthcare</option>
          <option value="Electricity">Electricity</option>
          <option value="Sanitation">Sanitation</option>
          <option value="Other">Other</option>
        </select>
        <button onclick="checkEscalations()" class="btn-progress">⚡ Check Escalations</button>
      </div>

      <div id="complaints-list" class="complaints-list" style="margin-top:20px;">
        <p class="loading">Loading...</p>
      </div>
    </div>
  </div>

  <script src="admin.js"></script>
</body>
</html>
