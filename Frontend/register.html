<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VillageConnect - Login / Register</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="navbar">
    <div class="logo">🏡 VillageConnect</div>
    <a href="index.html" class="nav-link">← Back to Home</a>
  </nav>

  <div class="auth-container">
    <div class="auth-card">
      <h2>Citizen Login / Register</h2>
      <p class="auth-subtitle">Enter your phone number to continue</p>

      <div id="step1">
        <div class="form-group">
          <label>Phone Number</label>
          <input type="text" id="phone" placeholder="Enter 10-digit phone number" maxlength="10">
        </div>
        <div class="form-group">
          <label>Full Name</label>
          <input type="text" id="name" placeholder="Enter your full name">
        </div>
        <div class="form-group">
          <label>Village Name</label>
          <input type="text" id="village" placeholder="Enter your village name">
        </div>
        <button onclick="sendOTP()" class="submit-btn">Send OTP</button>
      </div>

      <div id="step2" class="hidden">
        <div class="otp-info">
          📱 OTP sent! For demo purposes, your OTP is: <strong id="demo-otp"></strong>
        </div>
        <div class="form-group">
          <label>Enter OTP</label>
          <input type="text" id="otp-input" placeholder="Enter 6-digit OTP" maxlength="6">
        </div>
        <button onclick="verifyOTP()" class="submit-btn">Verify & Login</button>
        <button onclick="resendOTP()" class="btn-outline">Resend OTP</button>
      </div>

      <div id="msg" class="msg hidden"></div>
    </div>
  </div>

  <script src="auth.js"></script>
</body>
</html>
